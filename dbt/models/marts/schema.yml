version: 2
models:
  - name: fct_orders
    description: One latest state per order, including soft-deleted rows.
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: latest_event_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: product_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id
  - name: dim_customers
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
  - name: dim_products
    columns:
      - name: product_id
        data_tests: [unique, not_null]
  - name: mart_daily_revenue
    columns:
      - name: order_date
        data_tests: [unique, not_null]
