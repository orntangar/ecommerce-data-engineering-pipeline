ecommerce_de:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('PGHOST', 'localhost') }}"
      port: "{{ env_var('PGPORT', '55432') | int }}"
      user: "{{ env_var('PGUSER', 'portfolio') }}"
      password: "{{ env_var('PGPASSWORD', 'portfolio') }}"
      dbname: "{{ env_var('PGDATABASE', 'portfolio') }}"
      schema: analytics
      threads: 4
